                &lt;label class=&quot;oa-switch-row&quot;&gt;&lt;span&gt;&lt;span class=&quot;oa-label&quot;&gt;悬浮窗显示金额&lt;/span&gt;&lt;span class=&quot;oa-small&quot; style=&quot;display:block&quot;&gt;关闭后仅显示收入百分比&lt;/span&gt;&lt;/span&gt;&lt;input type=&quot;checkbox&quot; id=&quot;oa-money-toggle&quot; checked&gt;&lt;/label&gt;
                &lt;label class=&quot;oa-switch-row&quot;&gt;&lt;span&gt;&lt;span class=&quot;oa-label&quot;&gt;演示时自动隐藏金额&lt;/span&gt;&lt;span class=&quot;oa-small&quot; style=&quot;display:block&quot;&gt;检测到全屏共享时启用隐私模式&lt;/span&gt;&lt;/span&gt;&lt;input type=&quot;checkbox&quot; checked&gt;&lt;/label&gt;
                &lt;label class=&quot;oa-switch-row&quot;&gt;&lt;span&gt;&lt;span class=&quot;oa-label&quot;&gt;周五满九小时自动沉淀周报&lt;/span&gt;&lt;span class=&quot;oa-small&quot; style=&quot;display:block&quot;&gt;仅保存草稿，不自动外发&lt;/span&gt;&lt;/span&gt;&lt;input type=&quot;checkbox&quot; checked&gt;&lt;/label&gt;
              &lt;/section&gt;
            &lt;/div&gt;
          &lt;/section&gt;
        &lt;/main&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;oa-float-card&quot; id=&quot;oa-float-card&quot; aria-label=&quot;悬浮窗预览&quot;&gt;
      &lt;div class=&quot;oa-float-head&quot;&gt;&lt;strong id=&quot;oa-float-status&quot;&gt;上班中&lt;/strong&gt;&lt;button class=&quot;oa-icon-btn&quot; id=&quot;oa-close-float&quot; type=&quot;button&quot; aria-label=&quot;关闭悬浮窗预览&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-progress-label&quot;&gt;&lt;span id=&quot;oa-clock-in-label&quot;&gt;09:07 打卡&lt;/span&gt;&lt;span class=&quot;oa-float-time&quot; id=&quot;oa-float-time&quot;&gt;06:08:00 / 9h&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-track&quot; role=&quot;progressbar&quot; aria-label=&quot;九小时上班进度&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;68&quot; id=&quot;oa-float-progress&quot;&gt;&lt;div class=&quot;oa-fill oa-trail&quot; id=&quot;oa-float-time-fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div id=&quot;oa-float-income-block&quot;&gt;&lt;div class=&quot;oa-float-income&quot;&gt;&lt;span id=&quot;oa-float-income-label&quot;&gt;今日收入估算&lt;/span&gt;&lt;strong id=&quot;oa-float-money&quot;&gt;¥378 / ¥560&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-track&quot;&gt;&lt;div class=&quot;oa-fill oa-fill-income oa-trail&quot; id=&quot;oa-float-income-fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-hourly&quot; id=&quot;oa-float-hourly-block&quot; hidden&gt;&lt;div class=&quot;oa-hourly-title&quot;&gt;今日每小时牛马费低至&lt;/div&gt;&lt;div class=&quot;oa-hourly-value&quot; id=&quot;oa-float-hourly-value&quot;&gt;¥62.22 / 小时&lt;/div&gt;&lt;div class=&quot;oa-hourly-note&quot; id=&quot;oa-float-hourly-note&quot;&gt;日薪已封顶，时薪随加班时间实时下降 · 估算&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-float-task&quot;&gt;&lt;span class=&quot;oa-small&quot;&gt;正在做&lt;/span&gt;&lt;div class=&quot;oa-task-title&quot; style=&quot;margin-top:4px&quot;&gt;完善办公助手交互原型&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-float-actions&quot;&gt;&lt;button class=&quot;oa-btn&quot; data-open-add type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加&lt;/button&gt;&lt;button class=&quot;oa-btn oa-btn-primary&quot; id=&quot;oa-float-complete&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;完成&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;oa-demo-row&quot;&gt;&lt;button class=&quot;oa-btn&quot; id=&quot;oa-demo-forward&quot; type=&quot;button&quot;&gt;演示：快进至 9h&lt;/button&gt;&lt;button class=&quot;oa-btn&quot; id=&quot;oa-float-clock-out&quot; type=&quot;button&quot;&gt;下班打卡&lt;/button&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;oa-overlay&quot; id=&quot;oa-add-overlay&quot; hidden&gt;
      &lt;section class=&quot;oa-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;oa-add-title&quot;&gt;
        &lt;div class=&quot;oa-dialog-head&quot;&gt;&lt;h2 id=&quot;oa-add-title&quot;&gt;快速添加待办&lt;/h2&gt;&lt;button class=&quot;oa-icon-btn&quot; id=&quot;oa-close-add&quot; type=&quot;button&quot; aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
        &lt;label class=&quot;oa-field&quot;&gt;&lt;span class=&quot;oa-label&quot;&gt;待办内容&lt;/span&gt;&lt;input class=&quot;oa-input&quot; id=&quot;oa-add-input&quot; value=&quot;下周三提交季度客户分析&quot;&gt;&lt;/label&gt;
        &lt;div class=&quot;oa-date-chip&quot; id=&quot;oa-date-chip&quot;&gt;&lt;i data-lucide=&quot;calendar-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;oa-parsed-date&quot;&gt;计划：11 月 11 日（周三）&lt;/span&gt;&lt;/div&gt;
        &lt;label class=&quot;oa-field oa-date-edit&quot;&gt;&lt;span class=&quot;oa-small&quot;&gt;调整识别日期&lt;/span&gt;&lt;input class=&quot;oa-input&quot; type=&quot;date&quot; id=&quot;oa-date-override&quot; value=&quot;2026-11-11&quot;&gt;&lt;/label&gt;
        &lt;p class=&quot;oa-parse-note&quot; id=&quot;oa-parse-note&quot;&gt;已从“下周三”识别日期，保存前可修改。&lt;/p&gt;
        &lt;div class=&quot;oa-dialog-actions&quot;&gt;&lt;button class=&quot;oa-btn&quot; id=&quot;oa-cancel-add&quot; type=&quot;button&quot;&gt;取消&lt;/button&gt;&lt;button class=&quot;oa-btn oa-btn-primary&quot; id=&quot;oa-save-add&quot; type=&quot;button&quot;&gt;保存到未来&lt;/button&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;oa-toast&quot; id=&quot;oa-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;early-office-prototype&#x27;);
      const app = root.querySelector(&#x27;#oa-app&#x27;);
      const savedRaw = window.openai &amp;&amp; window.openai.widgetState ? window.openai.widgetState.modelContent : null;
      let saved = {};
      try { saved = typeof savedRaw === &#x27;string&#x27; ? JSON.parse(savedRaw) : (savedRaw || {}); } catch (_) { saved = {}; }
      const HOUR = 3600000;
      const todayKey = () =&gt; new Intl.DateTimeFormat(&#x27;en-CA&#x27;, {timeZone:&#x27;Asia/Shanghai&#x27;,year:&#x27;numeric&#x27;,month:&#x27;2-digit&#x27;,day:&#x27;2-digit&#x27;}).format(new Date());
      const hasCurrentClock = saved.workday === todayKey() &amp;&amp; saved.clockVersion === 3 &amp;&amp; Number.isFinite(saved.startedAt) &amp;&amp; saved.startedAt &lt;= Date.now();
      const legacyClock = !saved.workday &amp;&amp; [&#x27;working&#x27;,&#x27;overtime&#x27;,&#x27;done&#x27;].includes(saved.clock) ? saved.clock : &#x27;working&#x27;;
      const seededHours = legacyClock === &#x27;overtime&#x27; ? 9 + 32/60 : legacyClock === &#x27;done&#x27; ? 9 + 14/60 : 6 + 8/60;
      const state = {
        view: saved.view || &#x27;today&#x27;,
        fun: Boolean(saved.fun),
        showMoney: saved.showMoney !== false,
        clock: hasCurrentClock ? saved.clock : legacyClock,
        futureAdded: Boolean(saved.futureAdded),
        workday: hasCurrentClock ? saved.workday : todayKey(),
        startedAt: hasCurrentClock ? saved.startedAt : Date.now() - seededHours * HOUR,
        endedAt: hasCurrentClock ? (Number.isFinite(saved.endedAt) ? saved.endedAt : null) : legacyClock === &#x27;done&#x27; ? Date.now() : null
      };
      const design = { radius: 18, accent: &#x27;#526ff4&#x27;, density: &#x27;舒展&#x27; };
      let toastTimer = null;

      const views = [...root.querySelectorAll(&#x27;[data-view]&#x27;)];
      const navButtons = [...root.querySelectorAll(&#x27;[data-view-target]&#x27;)];
      const overlay = root.querySelector(&#x27;#oa-add-overlay&#x27;);
      const addInput = root.querySelector(&#x27;#oa-add-input&#x27;);
      const parsedDate = root.querySelector(&#x27;#oa-parsed-date&#x27;);
      const parseNote = root.querySelector(&#x27;#oa-parse-note&#x27;);
      const saveAdd = root.querySelector(&#x27;#oa-save-add&#x27;);
      const floatCard = root.querySelector(&#x27;#oa-float-card&#x27;);
      const funToggle = root.querySelector(&#x27;#oa-fun-toggle&#x27;);
      const moneyToggle = root.querySelector(&#x27;#oa-money-toggle&#x27;);
      const toast = root.querySelector(&#x27;#oa-toast&#x27;);

      function persist() {
        if (window.openai &amp;&amp; window.openai.setWidgetState) {
          window.openai.setWidgetState({
            modelContent: { view: state.view, fun: state.fun, showMoney: state.showMoney, clock: state.clock, futureAdded: state.futureAdded, clockVersion:3, workday:state.workday, startedAt:state.startedAt, endedAt:state.endedAt },
            privateContent: null
          }).catch(() =&gt; {});
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2400);
      }

      function switchView(name, shouldPersist = true) {
        const next = views.some(v =&gt; v.dataset.view === name) ? name : &#x27;today&#x27;;
        state.view = next;
        views.forEach(view =&gt; { view.hidden = view.dataset.view !== next; });
        navButtons.forEach(btn =&gt; { btn.classList.toggle(&#x27;is-active&#x27;, btn.dataset.viewTarget === next); if(btn.classList.contains(&#x27;oa-nav-item&#x27;)) btn.setAttribute(&#x27;aria-current&#x27;, btn.dataset.viewTarget === next ? &#x27;page&#x27; : &#x27;false&#x27;); });
        if (shouldPersist) persist();
      }

      function parseNaturalDate(text) {
        const value = text.trim();
        if (/下周三/.test(value)) return { label: &#x27;计划：11 月 11 日（周三）&#x27;, note: &#x27;已从“下周三”识别日期，保存前可修改。&#x27;, save: &#x27;保存到未来&#x27;, group: &#x27;2026-11-11&#x27; };
        if (/下个月\s*\d{1,2}[号日]?/.test(value)) {
          const day = (value.match(/下个月\s*(\d{1,2})/) || [,&#x27;15&#x27;])[1];
          return { label: `计划：12 月 ${day} 日`, note: &#x27;已识别下个月的具体日期。&#x27;, save: &#x27;保存到未来&#x27;, group: `2026-12-${String(day).padStart(2,&#x27;0&#x27;)}` };
        }
        if (/下个月/.test(value)) return { label: &#x27;下个月 · 日期待确认&#x27;, note: &#x27;没有找到具体日期，将进入“下个月·日期待定”。&#x27;, save: &#x27;保存并稍后安排&#x27;, group: &#x27;undecided&#x27; };
        if (/明天/.test(value)) return { label: &#x27;计划：11 月 6 日（周五）&#x27;, note: &#x27;已从“明天”识别日期。&#x27;, save: &#x27;保存到未来&#x27;, group: &#x27;2026-11-06&#x27; };
        if (/月底前|月末前/.test(value)) return { label: &#x27;截止：11 月 30 日 18:00&#x27;, note: &#x27;“前”被识别为截止时间。&#x27;, save: &#x27;保存到未来&#x27;, group: &#x27;2026-11-30&#x27; };
        return { label: &#x27;计划：今天&#x27;, note: &#x27;未识别到未来日期，默认进入今日待办。&#x27;, save: &#x27;保存到今日&#x27;, group: &#x27;today&#x27; };
      }

      function updateDatePreview() {
        const result = parseNaturalDate(addInput.value);
        parsedDate.textContent = result.label;
        parseNote.textContent = result.note;
        saveAdd.textContent = result.save;
        saveAdd.dataset.group = result.group;
        root.querySelector(&#x27;#oa-date-override&#x27;).value = result.group.startsWith(&#x27;2026-&#x27;) ? result.group : result.group === &#x27;today&#x27; ? &#x27;2026-11-05&#x27; : &#x27;&#x27;;
      }

      function openAdd() {
        overlay.hidden = false;
        updateDatePreview();
        addInput.focus();
        addInput.select();
      }

      function closeAdd() { overlay.hidden = true; }

      function addFutureTask() {
        const title = addInput.value.trim();
        if (!title) { showToast(&#x27;请先输入待办内容&#x27;); return; }
        const group = saveAdd.dataset.group;
        if (group === &#x27;today&#x27;) {
          const row = document.createElement(&#x27;label&#x27;);
          row.className = &#x27;oa-task-row&#x27;;
          row.innerHTML = `&lt;input class=&quot;oa-task-check&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;oa-task-copy&quot;&gt;&lt;span class=&quot;oa-task-title&quot;&gt;&lt;/span&gt;&lt;span class=&quot;oa-task-meta&quot;&gt;刚刚添加&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;oa-task-tag&quot;&gt;今天&lt;/span&gt;`;
          row.querySelector(&#x27;.oa-task-title&#x27;).textContent = title;
          root.querySelector(&#x27;#oa-today-list&#x27;).prepend(row);
          wireTaskCheckbox(row.querySelector(&#x27;input&#x27;));
          closeAdd(); switchView(&#x27;today&#x27;); showToast(&#x27;已加入今日待办&#x27;);
        } else {
          let targetGroup = [...root.querySelectorAll(&#x27;[data-date-group]&#x27;)].find(element =&gt; element.dataset.dateGroup === group);
          if (!targetGroup) {
            targetGroup = document.createElement(&#x27;section&#x27;);
            targetGroup.className = &#x27;oa-future-group&#x27;;
            targetGroup.dataset.dateGroup = group;
            const label = document.createElement(&#x27;div&#x27;);
            label.className = &#x27;oa-future-date&#x27;;
            label.textContent = group === &#x27;undecided&#x27; ? &#x27;日期待定&#x27; : group.replaceAll(&#x27;-&#x27;, &#x27; / &#x27;);
            targetGroup.appendChild(label);
            root.querySelector(&#x27;#oa-future-list&#x27;).prepend(targetGroup);
          }
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;oa-future-row&#x27;;
          row.innerHTML = `&lt;input class=&quot;oa-task-check&quot; type=&quot;checkbox&quot; aria-label=&quot;完成待办&quot;&gt;&lt;div&gt;&lt;div class=&quot;oa-task-title&quot;&gt;&lt;/div&gt;&lt;div class=&quot;oa-task-meta&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;oa-task-tag&quot;&gt;计划日期&lt;/span&gt;`;
          row.querySelector(&#x27;.oa-task-title&#x27;).textContent = title.replace(/下周三\s*/, &#x27;&#x27;);
          row.querySelector(&#x27;.oa-task-meta&#x27;).textContent = group === &#x27;undecided&#x27; ? &#x27;日期待确认，稍后安排&#x27; : `计划日期：${group}`;
          targetGroup.appendChild(row);
          wireTaskCheckbox(row.querySelector(&#x27;input&#x27;));
          state.futureAdded = true;
          closeAdd(); switchView(&#x27;future&#x27;); showToast(&#x27;已按识别日期加入未来待办&#x27;);
        }
        persist();
      }

      function renderClock() {
        const elapsed = Math.max(0, (state.endedAt ?? Date.now()) - state.startedAt);
        const done = state.endedAt !== null;
        const overtime = elapsed &gt;= 9 * HOUR;
        state.clock = done ? &#x27;done&#x27; : overtime ? &#x27;overtime&#x27; : &#x27;working&#x27;;
        const hours = Math.floor(elapsed / HOUR);
        const minutes = Math.floor(elapsed / 60000) % 60;
        const seconds = Math.floor(elapsed / 1000) % 60;
        const pad = value =&gt; String(value).padStart(2,&#x27;0&#x27;);
        const pct = Math.min(elapsed / (9*HOUR)*100, 100);
        const dailySalary = 560;
        const earned = dailySalary * pct / 100;
        const hourly = dailySalary / Math.max(elapsed / HOUR, 9);
        const extra = Math.max(0, elapsed - 9*HOUR);
        const status = done ? &#x27;已下班&#x27; : overtime ? `加班中 +${pad(Math.floor(extra/HOUR))}:${pad(Math.floor(extra/60000)%60)}` : &#x27;上班中&#x27;;
        const money = state.showMoney ? `¥${earned.toFixed(2)} / ¥${dailySalary}` : `${Math.round(pct)}%`;
        root.querySelector(&#x27;#oa-main-status&#x27;).textContent = status;
        root.querySelector(&#x27;#oa-main-time&#x27;).innerHTML = `${pad(hours)} &lt;small&gt;时&lt;/small&gt; ${pad(minutes)} &lt;small&gt;分&lt;/small&gt;`;
        root.querySelector(&#x27;#oa-main-percent&#x27;).textContent = `${Math.round(pct)}%`;
        root.querySelector(&#x27;#oa-main-time-fill&#x27;).style.width = `${pct}%`;
        root.querySelector(&#x27;#oa-main-time-fill&#x27;).classList.toggle(&#x27;is-overtime&#x27;, overtime &amp;&amp; !done);
        root.querySelector(&#x27;#oa-main-income-label&#x27;).textContent = overtime ? &#x27;今日每小时牛马费低至&#x27; : state.fun ? &#x27;🪙 今日窝囊费已到手&#x27; : &#x27;今日收入估算&#x27;;
        root.querySelector(&#x27;#oa-main-income-note&#x27;).textContent = overtime ? (done ? &#x27;下班时已定格&#x27; : &#x27;加班越久，时薪越低&#x27;) : &#x27;满九小时封顶&#x27;;
        root.querySelector(&#x27;#oa-main-money&#x27;).textContent = overtime ? (state.showMoney ? `¥${hourly.toFixed(2)} / 小时` : &#x27;金额已隐藏&#x27;) : money;
        root.querySelector(&#x27;#oa-main-income-progress&#x27;).hidden = overtime;
        root.querySelector(&#x27;#oa-main-hourly-note&#x27;).hidden = !overtime;
        root.querySelector(&#x27;#oa-main-income-percent&#x27;).textContent = `${Math.round(pct)}%`;
        root.querySelector(&#x27;#oa-main-income-fill&#x27;).style.width = `${pct}%`;
        root.querySelector(&#x27;#oa-float-status&#x27;).textContent = status;
        root.querySelector(&#x27;#oa-float-time&#x27;).textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)} / 9h`;
        root.querySelector(&#x27;#oa-clock-in-label&#x27;).textContent = `${new Intl.DateTimeFormat(&#x27;zh-CN&#x27;,{timeZone:&#x27;Asia/Shanghai&#x27;,hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;,hourCycle:&#x27;h23&#x27;}).format(new Date(state.startedAt))} 打卡`;
        root.querySelector(&#x27;#oa-float-time-fill&#x27;).style.width = `${pct}%`;
        root.querySelector(&#x27;#oa-float-time-fill&#x27;).classList.toggle(&#x27;is-overtime&#x27;, overtime &amp;&amp; !done);
        root.querySelector(&#x27;#oa-float-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;,String(Math.round(pct)));
        root.querySelector(&#x27;#oa-float-income-fill&#x27;).style.width = `${pct}%`;
        root.querySelector(&#x27;#oa-float-money&#x27;).textContent = money;
        root.querySelector(&#x27;#oa-float-income-block&#x27;).hidden = overtime;
        root.querySelector(&#x27;#oa-float-hourly-block&#x27;).hidden = !overtime;
        root.querySelector(&#x27;#oa-float-hourly-value&#x27;).textContent = state.showMoney ? `¥${hourly.toFixed(2)} / 小时` : &#x27;金额已隐藏&#x27;;
        root.querySelector(&#x27;#oa-float-hourly-note&#x27;).textContent = done ? &#x27;下班时已定格，今日不能重新上班 · 估算&#x27; : &#x27;日薪已封顶，时薪随加班时间实时下降 · 估算&#x27;;
        floatCard.classList.toggle(&#x27;is-overtime&#x27;, overtime &amp;&amp; !done);
        root.classList.toggle(&#x27;oa-is-done&#x27;, done);
        root.querySelector(&#x27;#oa-demo-forward&#x27;).disabled = done || overtime;
        for (const id of [&#x27;#oa-clock-out&#x27;,&#x27;#oa-float-clock-out&#x27;]) {
          const button = root.querySelector(id);
          button.disabled = done;
          button.textContent = done ? &#x27;今日已下班&#x27; : &#x27;下班打卡&#x27;;
        }
        root.querySelector(&#x27;#oa-day-subtitle&#x27;).textContent = done ? &#x27;今天的努力已收好，辛苦了。接下来的时间，留给自己。&#x27; : overtime ? &#x27;九小时卡点已到达，今日收入已封顶。忙完记得早点休息。&#x27; : &#x27;下午好，还有 3 项待办。上班时长持续累计，满九小时自动进入加班中。&#x27;;
      }

      function renderFun() {
        funToggle.checked = state.fun;
        moneyToggle.checked = state.showMoney;
